<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Chaplin Bubble</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: transparent; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-font-smoothing: antialiased; user-select: none;
    }
    .bubble {
      position: relative; width: 100%; height: 100%;
      border-radius: 18px; overflow: hidden;
      background: #0b0b0f;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.5);
      display: flex; flex-direction: column;
    }
    .cam {
      position: relative; width: 100%; background: #000; flex: 1 1 auto; min-height: 0;
    }
    .bubble.layout-corner .cam { flex: none; }
    .bubble.shape-wide .cam { aspect-ratio: 4 / 3; }
    .bubble.shape-square .cam { aspect-ratio: 1 / 1; }
    .bubble.shape-portrait .cam { aspect-ratio: 9 / 16; }
    .bubble.shape-circle .cam {
      aspect-ratio: 1 / 1; width: calc(100% - 20px); margin: 10px auto 0;
      border-radius: 50%;
    }
    video {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transform: scaleX(-1);            /* selfie mirror */
    }
    .bubble.layout-meeting .caps { padding: 12px 16px 16px; gap: 5px; }
    .bubble.layout-meeting .line { font-size: 16px; max-height: 3.4em; }
    .bubble.layout-meeting .line.now { font-size: 19px; }
    .rec {
      position: absolute; top: 8px; left: 8px;
      display: flex; align-items: center; gap: 6px;
      padding: 3px 8px; border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      font-size: 11px; font-weight: 600; color: #fff;
    }
    .rec .dot { width: 7px; height: 7px; border-radius: 50%; background: #ff5d5d; animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    .caps {
      flex: 0 0 auto; min-height: 76px; padding: 8px 10px 10px; overflow: hidden;
      display: flex; flex-direction: column; justify-content: flex-end; gap: 3px;
    }
    .line {
      font-size: 12.5px; line-height: 1.35; color: rgba(255,255,255,0.55);
      max-height: 2.7em; overflow: hidden;
    }
    .line.now { color: #fff; font-weight: 600; font-size: 13.5px; }
    .line:empty { display: none; }
  </style>
</head>
<body>
  <div class="bubble">
    <div class="cam">
      <video id="cam" autoplay playsinline muted></video>
      <div class="rec"><span class="dot"></span><span id="clock">0:00</span></div>
    </div>
    <div class="caps">
      <div class="line" id="prev"></div>
      <div class="line now" id="now">Listening…</div>
    </div>
  </div>
  <script src="bubble.js"></script>
</body>
</html>
