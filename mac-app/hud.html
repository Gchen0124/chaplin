<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Chaplin HUD</title>
  <style>
    :root {
      --bg: rgba(20, 20, 24, 0.88);
      --fg: #f5f6f8;
      --dim: rgba(245, 246, 248, 0.62);
      --red: #ff5d5d;
      --green: #4ade80;
      --line: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: transparent; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-font-smoothing: antialiased; user-select: none; cursor: default;
      color: var(--fg);
    }
    body { display: flex; align-items: center; justify-content: center; }
    .pill {
      display: flex; align-items: center; gap: 12px;
      height: 48px; padding: 0 14px; border-radius: 24px;
      background: var(--bg);
      border: 1px solid var(--line);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
    .view { display: none; align-items: center; gap: 12px; }
    .view.on { display: flex; }

    .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--red); flex: none; }
    .dot.pulse { animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }
    .timer { font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 600; min-width: 38px; }
    .label { font-size: 13px; color: var(--dim); }

    .spinner {
      width: 15px; height: 15px; border-radius: 50%; flex: none;
      border: 2px solid rgba(255,255,255,0.22); border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .btn {
      -webkit-appearance: none; appearance: none;
      width: 30px; height: 30px; border-radius: 50%;
      border: 1px solid var(--line); background: rgba(255,255,255,0.06);
      color: var(--fg); display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; padding: 0; flex: none; transition: background 0.12s ease, transform 0.08s ease;
    }
    .btn:hover { background: rgba(255,255,255,0.14); }
    .btn:active { transform: scale(0.94); }
    .btn.stop { color: #fff; }
    .btn.cancel { color: var(--dim); }
    .btn.ok { color: var(--green); border-color: rgba(74,222,128,0.4); }

    .square { width: 10px; height: 10px; border-radius: 2px; background: currentColor; }
    .glyph { position: relative; width: 11px; height: 12px; display: block; }
    .pause .glyph::before, .pause .glyph::after {
      content: ""; position: absolute; top: 0; width: 3px; height: 12px;
      border-radius: 1px; background: currentColor;
    }
    .pause .glyph::before { left: 0; }
    .pause .glyph::after { right: 0; }
    #recording.paused .dot { animation: none; opacity: 0.35; }
    #recording.paused .glyph::before {
      left: 1px; top: 1px; width: 0; height: 0; background: transparent;
      border-left: 9px solid currentColor;
      border-top: 5px solid transparent; border-bottom: 5px solid transparent;
    }
    #recording.paused .glyph::after { display: none; }
    .x { position: relative; width: 12px; height: 12px; }
    .x::before, .x::after {
      content: ""; position: absolute; left: 50%; top: 50%;
      width: 13px; height: 2px; border-radius: 2px; background: currentColor;
    }
    .x::before { transform: translate(-50%, -50%) rotate(45deg); }
    .x::after { transform: translate(-50%, -50%) rotate(-45deg); }
    .check { position: relative; width: 13px; height: 13px; }
    .check::before {
      content: ""; position: absolute; left: 1px; top: 2px;
      width: 5px; height: 9px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
      transform: rotate(45deg);
    }
    .msg { font-size: 13px; max-width: 210px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .donewrap { display: flex; flex-direction: column; gap: 4px; min-width: 0; max-width: 400px; }
    .doneText {
      font-size: 14px; line-height: 1.4; color: #fff; font-weight: 500;
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
      overflow: hidden; word-break: break-word;
    }
    body.tall .pill { height: 100%; border-radius: 16px; align-items: flex-start; padding: 14px 16px; }
    body.tall .view { width: 100%; align-items: flex-start; }
  </style>
</head>
<body>
  <div class="pill">
    <div class="view" id="recording">
      <span class="dot pulse"></span>
      <span class="timer" id="timer">0:00</span>
      <span style="width:6px"></span>
      <button class="btn pause" id="pause" title="Pause / resume"><span class="glyph"></span></button>
      <button class="btn stop" id="stop" title="Stop and transcribe"><span class="square"></span></button>
      <button class="btn cancel" id="cancel" title="Cancel (discard)"><span class="x"></span></button>
    </div>

    <div class="view" id="processing">
      <span class="spinner"></span>
      <span class="label">Transcribing…</span>
      <button class="btn cancel" id="dismiss" title="Dismiss"><span class="x"></span></button>
    </div>

    <div class="view" id="done">
      <button class="btn ok" id="confirm" title="Confirm"><span class="check"></span></button>
      <div class="donewrap">
        <div class="label" id="doneLabel">Refined · on clipboard (⌘V)</div>
        <div class="doneText" id="doneText"></div>
      </div>
    </div>

    <div class="view" id="error">
      <span class="dot" style="background:var(--red)"></span>
      <span class="msg" id="errorMsg">Something went wrong</span>
      <button class="btn cancel" id="errorDismiss" title="Dismiss"><span class="x"></span></button>
    </div>
  </div>

  <script src="hud.js"></script>
</body>
</html>
