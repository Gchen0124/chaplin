<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Chaplin</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0d12;
      color: #e7e9ee;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 40px;
      text-align: center;
    }
    .mark {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .mark span { color: #74ebc0; }
    .sub { color: rgba(231,233,238,0.55); font-size: 14px; max-width: 520px; line-height: 1.5; }
    .bar {
      width: 220px; height: 3px; border-radius: 2px;
      background: rgba(255,255,255,0.1); overflow: hidden;
    }
    .bar i {
      display: block; height: 100%; width: 40%;
      background: #74ebc0; border-radius: 2px;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(320%); }
    }
    pre {
      display: none;
      max-width: 720px; max-height: 46vh; overflow: auto;
      text-align: left; font-size: 12px; line-height: 1.55;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px; padding: 16px;
      white-space: pre-wrap; word-break: break-word;
    }
    .error .bar { display: none; }
    .error pre { display: block; }
    .error .sub { color: #ff8a8a; }
  </style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="mark">Chaplin<span>.</span></div>
    <div class="bar"><i></i></div>
    <div class="sub" id="sub">Starting the Chaplin server…</div>
    <pre id="detail"></pre>
  </div>
  <script src="loading.js"></script>
</body>
</html>
