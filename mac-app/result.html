<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Chaplin Refined</title>
  <style>
    html, body {
      margin: 0; height: 100%; background: transparent; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-font-smoothing: antialiased; color: #fff; user-select: text;
    }
    .card {
      height: 100%; box-sizing: border-box; padding: 12px 14px;
      border-radius: 16px; background: rgba(20, 20, 24, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.5);
      display: flex; flex-direction: column; gap: 8px;
    }
    .head { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; color: rgba(245,246,248,0.55); }
    .head .ok { color: #4ade80; }
    .hint { margin-left: auto; color: #4ade80; font-weight: 600; text-transform: none; letter-spacing: 0; }
    textarea {
      flex: 1; resize: none; border: none; outline: none; background: transparent;
      color: #fff; font: inherit; font-size: 14px; line-height: 1.45; user-select: text;
    }
    .row { display: flex; gap: 8px; justify-content: flex-end; }
    button {
      font: inherit; font-size: 12px; border-radius: 8px; padding: 5px 12px; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); color: #fff;
    }
    button.primary { background: rgba(74,222,128,0.18); border-color: rgba(74,222,128,0.45); }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="card">
    <div class="head"><span class="ok">✓ Refined</span><span>edit · ⌘C</span><span class="hint" id="hint"></span></div>
    <textarea id="text" spellcheck="false" placeholder="…"></textarea>
    <div class="row">
      <button id="close">Close</button>
      <button id="copy" class="primary">Copy</button>
    </div>
  </div>
  <script src="result.js"></script>
</body>
</html>
